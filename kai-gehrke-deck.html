<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Gehrke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60000;
    --charcoal: #25282b;
    --white: #ffffff;
    --grey: #7e7e7e;
    --light-neutral: #f2f2f2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d9d9d9;
    height: 100%;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .viewport {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .deck {
    width: 1920px;
    height: 1080px;
    flex-shrink: 0;
    position: relative;
    background: var(--white);
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateX(28px);
    transition: opacity .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1);
    z-index: 1;
    pointer-events: none;
  }

  .slide.is-active {
    opacity: 1;
    transform: translateX(0);
    z-index: 2;
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .2s linear; transform: none !important; }
  }

  .safe {
    position: absolute;
    inset: 96px;
  }

  /* ---------- Slide 1 : intro ---------- */

  .content-row {
    display: flex;
    align-items: center;
    gap: 64px;
    margin-top: 96px;
  }

  .portrait {
    width: 420px;
    height: 420px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--light-neutral);
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .text-col {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .name {
    margin: 0;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--charcoal);
    font-size: 126px;
    line-height: 0.90;
    letter-spacing: -2px;
  }

  .name--light { color: var(--white); }

  .accent-bar {
    width: 120px;
    height: 8px;
    border-radius: 2px;
    background: var(--red);
  }

  .footer {
    position: absolute;
    left: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }

  .wordmark {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--charcoal);
    text-transform: lowercase;
  }

  .wordmark--light { color: var(--white); }

  /* ---------- Slide 2 : favourite club ---------- */

  .hero-media {
    position: absolute;
    inset: 0;
  }

  .hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(100deg, rgba(8,9,10,.86) 0%, rgba(8,9,10,.58) 30%, rgba(8,9,10,.08) 56%, rgba(8,9,10,0) 68%),
      linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 28%);
  }

  .hero-content {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    height: 100%;
    max-width: 1150px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--white);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .eyebrow-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }

  .est {
    margin: 0;
    color: rgba(255,255,255,.72);
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 1px;
  }

  /* ---------- Nav chrome ---------- */

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--white);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    box-shadow: none;
  }

  .nav-arrow svg { width: 18px; height: 18px; }

  .nav-arrow--prev { left: 40px; }
  .nav-arrow--next { right: 40px; }

  .dots-wrap {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.35);
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: rgba(255,255,255,.5);
    cursor: pointer;
    transition: background .25s ease, transform .25s ease;
  }

  .dot.is-active {
    background: var(--red);
    transform: scale(1.3);
  }
</style>
</head>

            <path d="M25.5 11 C19 11 14.5 16.2 14.5 22.4 C14.5 26.6 17 29.3 20.3 29.3 C24.3 29.3 27 25.8 27 21.8 C27 18.9 25.2 17 22.7 17 C20.9 17 19.6 18.1 19.1 19.6 C19.5 19.5 19.9 19.4 20.3 19.4 C22 19.4 23.2 20.7 23.2 22.5 C23.2 24.6 21.6 26.3 19.6 26.3 C17.2 26.3 15.6 24.2 15.6 21.3 C15.6 16.1 19.9 12.3 25.5 12.3 Z" fill="#ffffff"></path>
          </svg>
          <span class="wordmark wordmark--light">vodafone-inspired brand system</span>
        </div>
      </section>

      <button class="nav-arrow nav-arrow--prev" id="prevBtn" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#25282b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-arrow nav-arrow--next" id="nextBtn" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#25282b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="dots-wrap" role="tablist" aria-label="Slide navigation">
        <button class="dot is-active" data-index="0" aria-label="Go to slide 1"></button>
        <button class="dot" data-index="1" aria-label="Go to slide 2"></button>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
      var current = 0;

      function goTo(i) {
        var next = (i + slides.length) % slides.length;
        if (next === current) return;
        slides[current].classList.remove('is-active');
        dots[current].classList.remove('is-active');
        current = next;
        slides[current].classList.add('is-active');
        dots[current].classList.add('is-active');
      }

      document.getElementById('nextBtn').addEventListener('click', function () { goTo(current + 1); });
      document.getElementById('prevBtn').addEventListener('click', function () { goTo(current - 1); });
      dots.forEach(function (dot, idx) {
        dot.addEventListener('click', function () { goTo(idx); });
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') goTo(current + 1);
        if (e.key === 'ArrowLeft') goTo(current - 1);
      });

      function fitDeck() {
        var deck = document.getElementById('deck');
        var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        deck.style.transform = 'scale(' + scale + ')';
        deck.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fitDeck);
      window.addEventListener('load', fitDeck);
      fitDeck();
    })();
  </script>
</body>
