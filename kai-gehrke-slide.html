<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Gehrke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60000;
    --charcoal: #25282b;
    --white: #ffffff;
    --grey: #7e7e7e;
    --light-neutral: #f2f2f2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d9d9d9;
    height: 100%;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .viewport {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1920px;
    height: 1080px;
    flex-shrink: 0;
    position: relative;
    background: var(--white);
    overflow: hidden;
  }

  .safe {
    position: absolute;
    inset: 96px;
  }

  .content-row {
    display: flex;
    align-items: center;
    gap: 64px;
    margin-top: 96px;
  }

  .portrait {
    width: 420px;
    height: 420px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--light-neutral);
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .text-col {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .name {
    margin: 0;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--charcoal);
    font-size: 126px;
    line-height: 0.90;
    letter-spacing: -2px;
  }

  .accent-bar {
    width: 120px;
    height: 8px;
    border-radius: 2px;
    background: var(--red);
  }

  .footer {
    position: absolute;
    left: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }

  .wordmark {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--charcoal);
    text-transform: lowercase;
  }

  @media (max-width: 1920px) {
    .viewport { align-items: flex-start; justify-content: flex-start; }
  }
</style>
</head>
